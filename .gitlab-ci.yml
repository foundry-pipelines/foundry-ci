# Runs on every push to main here, and when foundry-platform/common/configRegistry or foundry-common change
# (triggered from there): publishes the manifest IDE schema as this job's artifact. Tests run on every push.
test:
  image: python:3.12
  script:
    - pip install --quiet pyyaml pytest
    - pytest -q -p no:cacheprovider tests

schema:
  image: python:3.12  # not -slim: needs git
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - pip install --quiet pyyaml
    - git clone --quiet --depth 1 https://gitlab.com/foundry-platform/common/configRegistry.git /tmp/registry
    - python ide/manifest_schema.py --registry /tmp/registry -o manifest.schema.json
  artifacts:
    paths: [manifest.schema.json]
    expire_in: never
