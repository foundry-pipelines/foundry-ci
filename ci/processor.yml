# Processor repos include this:
#
#   include:
#     - project: foundry-platform/common/scripts
#       file: ci/processor.yml
#
# Checks operator.yaml (validators/processors/typecheck.py), generates the JSON Schemas of the types the operator
# owns (schema/SchemaGen: NJsonSchema, the System.Text.Json settings the operators serialize with). On merge requests,
# a breaking change against the latest version in common/schemaRegistry fails; on main, changed schemas are
# committed there as new versions. Either fails if another operator owns the type (<Type>/owner.txt).
# Builds the processor's arm64 image with the .NET SDK (no Docker needed) and pushes it as
# $CI_REGISTRY_IMAGE[/<PROCESSOR_PATH>]:$CI_COMMIT_SHORT_SHA, the image deploy/render.py points at,
# then re-renders the pipelines so ones following this branch pick it up.
variables:
  PROCESSOR_PATH: ""  # the processor's folder, in a repo holding several

stages: [validate, build, deploy]

validate:
  stage: validate
  image: python:3.12
  script:
    - pip install --quiet pyyaml
    - git clone --quiet --depth 1 https://gitlab.com/foundry-platform/common/scripts.git /tmp/scripts
    - python /tmp/scripts/validators/processors/typecheck.py "${PROCESSOR_PATH:-.}"

schemas:
  stage: validate
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - git clone --quiet --depth 1 https://gitlab.com/foundry-platform/common/scripts.git /tmp/scripts
    - DIR=${PROCESSOR_PATH:-.}
    - PROJECT=$(ls "$DIR"/*.csproj | head -1)
    - dotnet build "$PROJECT" -c Release -o /tmp/operator
    - dotnet run --project /tmp/scripts/schema/SchemaGen -- "/tmp/operator/$(basename "$PROJECT" .csproj).dll" "$DIR/operator.yaml" schemas
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  artifacts:
    paths: [schemas/]

schema-check:
  stage: build
  needs: [schemas]
  image: python:3.12
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - pip install --quiet pyyaml
    - git clone --quiet --depth 1 https://gitlab.com/foundry-platform/common/scripts.git /tmp/scripts
    - git clone --quiet --depth 1 https://gitlab.com/foundry-platform/common/schemaRegistry.git /tmp/schemaRegistry
    - python /tmp/scripts/schema/registry.py check schemas --owner "$CI_PROJECT_PATH${PROCESSOR_PATH:+/$PROCESSOR_PATH}" --registry /tmp/schemaRegistry

# Commits new schema versions to schemaRegistry over SSH with its deploy key (SCHEMA_REGISTRY_KEY: base64, a
# protected group variable, so main only).
schema-publish:
  stage: build
  needs: [validate, schemas]
  image: python:3.12
  resource_group: schema-registry
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - pip install --quiet pyyaml
    - git clone --quiet --depth 1 https://gitlab.com/foundry-platform/common/scripts.git /tmp/scripts
    - OWNER="$CI_PROJECT_PATH${PROCESSOR_PATH:+/$PROCESSOR_PATH}"
    - mkdir -p ~/.ssh && echo "$SCHEMA_REGISTRY_KEY" | base64 -d > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -q gitlab.com >> ~/.ssh/known_hosts
    - git clone --quiet git@gitlab.com:foundry-platform/common/schemaRegistry.git /tmp/schemaRegistry
    - python /tmp/scripts/schema/registry.py publish schemas --owner "$OWNER" --registry /tmp/schemaRegistry
    - cd /tmp/schemaRegistry && git add -A
    - if git diff --cached --quiet; then echo "schemaRegistry: nothing new"; exit 0; fi
    - git -c user.name="Foundry CI" -c user.email="noreply@gitlab.com" commit -qm "$OWNER@$CI_COMMIT_SHORT_SHA" -m "$(git diff --cached --name-only)"
    - |
      for i in 1 2 3; do
        git push -q origin HEAD:main && exit 0
        git pull -q --rebase origin main
      done
      exit 1

build-image:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:8.0
  variables:
    SDK_CONTAINER_REGISTRY_UNAME: $CI_REGISTRY_USER
    SDK_CONTAINER_REGISTRY_PWORD: $CI_REGISTRY_PASSWORD
  script:
    - SUFFIX=$(echo "$PROCESSOR_PATH" | tr 'A-Z' 'a-z' | sed -E 's#[^a-z0-9/]+#-#g; s#^/+|/+$##g')
    - REPOSITORY=${CI_PROJECT_PATH,,}${SUFFIX:+/$SUFFIX}
    - >
      dotnet publish "${PROCESSOR_PATH:-.}" -c Release -r linux-arm64 --self-contained false
      -t:PublishContainer -p:EnableSdkContainerSupport=true -p:ContainerUser=1654
      -p:ContainerRegistry=$CI_REGISTRY -p:ContainerRepository=$REPOSITORY -p:ContainerImageTags=$CI_COMMIT_SHORT_SHA

render:
  stage: deploy
  needs: [build-image, schema-publish]  # the pipelines' validators look the types up in schemaRegistry
  inherit:
    variables: false  # pipelines doesn't accept pipeline variables
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  trigger:
    project: foundry-platform/pipelines
