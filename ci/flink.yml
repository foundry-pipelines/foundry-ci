# Flink processor repos include this:
#
#   include:
#     - project: foundry-platform/common/scripts
#       file: ci/flink.yml
#
# Builds the job jar (Gradle, `shadowJar` producing build/libs/job.jar) and pushes an arm64 image of the
# official Flink image plus that jar at /opt/flink/usrlib/job.jar, as $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
# (what manifest.py k8s points a FlinkDeployment at); then re-renders and deploys the pipelines.
# crane appends the jar as one layer, so no Docker daemon and no emulation are needed.
variables:
  FLINK_IMAGE: flink:2.2.1-java21  # keep in step with FLINK_VERSION in manifest.py

stages: [build, image, deploy]

build-jar:
  stage: build
  image: gradle:jdk21
  script:
    - gradle --no-daemon -q shadowJar
  artifacts:
    paths: [build/libs/job.jar]

build-image:
  stage: image
  needs: [build-jar]
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  script:
    - crane auth login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - mkdir -p layer/opt/flink/usrlib && cp build/libs/job.jar layer/opt/flink/usrlib/job.jar
    - tar -C layer -cf layer.tar opt
    - crane append --platform linux/arm64 -b "$FLINK_IMAGE" -f layer.tar -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

render:
  stage: deploy
  needs: [build-image]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  inherit:
    variables: false  # foundry-pipelines doesn't accept pipeline variables
  trigger:
    project: foundry-platform/foundry-pipelines
